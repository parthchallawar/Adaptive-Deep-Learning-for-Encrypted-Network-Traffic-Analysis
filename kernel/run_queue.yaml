# Kaggle training queue (spec 015). kernel/kernel.py works through this in order and
# stops issuing new entries once under 40 minutes remain in the session. An entry whose
# run is already finished -- in this session, or restored from the previous session's
# mounted output (plan phase 3 T2, docs/kaggle-workflow.md) -- is skipped; a paused one
# continues. Each entry trains on the split its own config names (d1_open.yaml).
#
# `split`/`data_root`/`standardizer` are set by kernel.py itself (the paths its mounted
# datasets resolve to); do not set them here.
#
# PHASE 3, KAGGLE WEEK 1, SESSION 1 (~6.6 GPU-hours total, safe within the 11.5h guard):
#   1. Reference scratch prefix PAT (100% labels, seed 0, 8 epochs)
#   2. The five single-change design ablations (4 epochs each):
#        - abl_noside: model.side_channel=false
#        - abl_ramp1:  objective.ramp=1.0 (uniform loss)
#        - abl_ls0:    train.label_smoothing=0.0
#        - abl_drop0:  model.dropout=0.0
#        - abl_noaug:  finetune_augment disabled
#   3. Golden SSL Pretraining (NPP + PFC with twin masking, seed 0, 8 epochs)
#   4. B5 Full-Flow PAT Baseline (seed 0, 8 epochs)
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_noside", "model.side_channel=false", "train.epochs=4"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_ramp1", "objective.ramp=1.0", "train.epochs=4"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_ls0", "train.label_smoothing=0.0", "train.epochs=4"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_drop0", "model.dropout=0.0", "train.epochs=4"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_noaug", "finetune_augment.drop_p=0.0", "finetune_augment.ipt_s=0.0", "train.epochs=4"]
- config: configs/train/pt_pat_npp_pfc_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8"]
- config: configs/train/b5_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8"]
