# Kaggle queue (spec 015). kernel/kernel.py works through this in order and stops issuing new
# entries once under 40 minutes remain in the session. An entry whose work is already finished
# -- in this session, or restored from a previous session's mounted output -- is skipped.
#
# `split`/`data_root`/`standardizer`/`run_dir`/`out_dir` are set by kernel.py itself (the paths its
# mounted datasets resolve to); do not set them here.
#
# PHASE 4, SESSION 5: score passes and the H3/H2/H4 reports. No training in this session.
# (Phase 3's Session 4 queue -- seeds 1 and 2 of the tuned pair and B3 -- is in git history.)
#
# A `score:` entry (plan phase 4, T1/T2/T6; kernel.run_score_entry) runs
# `adl_etc.evaluation.score_run` on an already-trained run and then builds its
# H3/H2/H4 report (`evaluation.phase4.report_for_run`). Output goes to
# results/scores/<run>/: the big per-prefix score files under eval/<split>/scores/ (~1 GB a run,
# leave them on Kaggle) and the small files to pull: eval/phase4.json and unknown.{npz,json}.
#
# The nine headline runs come from the slim checkpoint dataset
# (parthchallawar/adl-encrypted-traffic-checkpoints, listed in dataset_sources), which holds
# best.pt, config_resolved.yaml, label_space.json, calibration.json and state.json for each.
# Headline model first (the tuned SSL PAT), then its from-scratch twin (H1's packets-to-decision
# comparison), then the GRU baseline (closed-world policy comparison only: it has no projection
# head, so no unknown model). Seed by seed within each model, so a session cut short still
# leaves complete seeds.
#
# Sizes (set to keep the whole session near 4-5 h, estimated from CPU measurements, not yet
# measured on a T4): 250k flows each for val and test_id (the same draw phase 3's evaluations
# used), 20k per week for the 18 drift weeks, and a Gaussian bank from 1,500 known training
# flows per class. Per PAT run roughly 1.0M flows scored.
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-ssl_tuned-d1open-s0
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-ssl_tuned-d1open-s1
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-ssl_tuned-d1open-s2
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-tuned-d1open-s0
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-tuned-d1open-s1
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: ft-pat-tuned-d1open-s2
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: bl-gru-main-d1open-s0
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: bl-gru-main-d1open-s1
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
- score: configs/eval/d1_open_scores.yaml
  run: bl-gru-main-d1open-s2
  overrides: ["device=cuda", "batch_size=2048", "splits.test_drift.per_period=20000"]
