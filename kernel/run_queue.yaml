# Kaggle training queue (spec 015). kernel/kernel.py works through this in order and
# stops issuing new entries once under 40 minutes remain in the session. An entry whose
# run is already finished -- in this session, or restored from the previous session's
# mounted output (plan phase 3 T2, docs/kaggle-workflow.md) -- is skipped; a paused one
# continues. Each entry trains on the split its own config names (d1_open.yaml).
# `eval:` entries evaluate an already-trained run (plan phase 3 T8): output goes to
# results/robust/<run>/eval/test_id/.
#
# `split`/`data_root`/`standardizer` are set by kernel.py itself (the paths its mounted
# datasets resolve to); do not set them here.
#
# PHASE 3, SESSION 4 (~6.5 GPU-hours; Session 3 = kernel v16, 2026-11-15, 2h28m).
# Seeds 1 and 2 for the recommended recipe and its strongest baseline, so the phase-3
# headline numbers are mean +/- std over three seeds and the paired bootstrap has
# per-flow predictions. Measured in Sessions 2-3 on one T4: a tuned PAT ~1 h, the GRU
# ~40 min, a robustness eval ~5 min.
# Mounts: this kernel's own latest output (v16: the SSL pretraining run, restored there
# from v15, and the tuned pair's seed 0) and the slim checkpoint dataset (B3's seed 0,
# which only v15 holds; B5).
#   0. SSL pretraining (restored from v16, skipped; supplies init_from)
#   1. Seed 1, then seed 2: tuned scratch, tuned SSL, B3 GRU. Seed by seed, so a
#      session cut short still leaves complete seeds.
#   2. Robustness on test_id for all nine runs. Seed 0 is evaluated again because
#      Session 3's evaluations predate predictions.npz; same flows and damage (eval
#      seed 0), so its reports reproduce Session 3's.
- config: configs/train/pt_pat_npp_pfc_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8"]
- config: configs/train/ft_pat_d1_tuned.yaml
  overrides: ["seed=1", "device=cuda"]
- config: configs/train/ft_pat_ssl_d1_tuned.yaml
  overrides: ["seed=1", "device=cuda", "init_from=results/pt-pat_pretrain-npp_pfc-d1open-s0/best.pt"]
- config: configs/train/b3_gru_d1.yaml
  overrides: ["seed=1", "device=cuda", "split=configs/splits/d1_open.yaml", "split_name=d1open"]
- config: configs/train/ft_pat_d1_tuned.yaml
  overrides: ["seed=2", "device=cuda"]
- config: configs/train/ft_pat_ssl_d1_tuned.yaml
  overrides: ["seed=2", "device=cuda", "init_from=results/pt-pat_pretrain-npp_pfc-d1open-s0/best.pt"]
- config: configs/train/b3_gru_d1.yaml
  overrides: ["seed=2", "device=cuda", "split=configs/splits/d1_open.yaml", "split_name=d1open"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-ssl_tuned-d1open-s1
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-tuned-d1open-s1
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: bl-gru-main-d1open-s1
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-ssl_tuned-d1open-s2
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-tuned-d1open-s2
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: bl-gru-main-d1open-s2
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-ssl_tuned-d1open-s0
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: ft-pat-tuned-d1open-s0
  overrides: ["device=cuda"]
- eval: configs/eval/d1_open_robust.yaml
  run: bl-gru-main-d1open-s0
  overrides: ["device=cuda"]
