# Kaggle training queue (spec 015). kernel/kernel.py works through this in order and
# stops issuing new entries once under 40 minutes remain in the session. An entry whose
# run is already finished -- in this session, or restored from the previous session's
# mounted output (plan phase 3 T2, docs/kaggle-workflow.md) -- is skipped; a paused one
# continues. Each entry trains on the split its own config names (d1_open.yaml).
#
# `split`/`data_root`/`standardizer` are set by kernel.py itself (the paths its mounted
# datasets resolve to); do not set them here.
#
# PHASE 3, KAGGLE WEEK 1, PART A1 (plan phase 3, "Order and parallelism"; sized from the
# throughput smoke run #2 measured on a T4: B5 ~13,400 flows/s, prefix fine-tuning
# ~11,600, i.e. ~2.4 h and ~2.1 h per full run): ~9.6 GPU-hours, one session.
#   1. B5 (spec 005/006), 3 seeds: the first real PAT runs on D1.
#   2. The design-ablation reference: the scratch prefix-trained PAT with every default,
#      100% labels, seed 0 (also the fine-tuning grid's scratch-100% seed 0).
# Part A2 (the five single-change design ablations, ~10.7 h at full budget) follows in
# its own session; their val numbers decide SSL's input (side channel) and the grid.
# Phase 2's entries (B2, B3 on d1_main; all finished) were removed; the open-set
# re-runs of B2/B3 (T1b) are queued in whichever week has spare quota.
- config: configs/train/b5_pat_d1.yaml
  overrides: ["seed=0", "device=cuda"]
- config: configs/train/b5_pat_d1.yaml
  overrides: ["seed=1", "device=cuda"]
- config: configs/train/b5_pat_d1.yaml
  overrides: ["seed=2", "device=cuda"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda"]
