# Kaggle training queue (spec 015). kernel/kernel.py works through this in order and
# stops issuing new entries once under 40 minutes remain in the session. An entry whose
# run is already finished -- in this session, or restored from the previous session's
# mounted output (plan phase 3 T2, docs/kaggle-workflow.md) -- is skipped; a paused one
# continues. Each entry trains on the split its own config names (d1_open.yaml).
#
# `split`/`data_root`/`standardizer` are set by kernel.py itself (the paths its mounted
# datasets resolve to); do not set them here.
#
# PHASE 3, SESSION 2 (~5 GPU-hours; Session 1 = kernel version 14, 2026-11-13, 7h19m).
# Needs Session 1's output mounted: kernel-metadata.json lists this kernel's own slug in
# `kernel_sources`, so the SSL run below is restored and skipped, and its best.pt is
# what the SSL fine-tunes start from. Runs on the main account (the mount is private).
#   0. SSL pretraining (restored from Session 1, skipped; must match its overrides)
#   1. 4-epoch reference: the control Session 1's 4-epoch ablations lacked (the LR
#      schedule spans train.epochs, so the 8-epoch run's epoch 4 is not comparable)
#   2. SSL fine-tune, 100% labels, 8 epochs (vs Session 1's 8-epoch scratch run: H1)
#   3. 10% labels: scratch vs SSL (config defaults, 15 epochs)
#   4. 1% labels: scratch vs SSL (config defaults, 6 x 512k-sample epochs)
#   5. B3 GRU and B2 CNN re-run on the open-set split (one seed each)
- config: configs/train/pt_pat_npp_pfc_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8"]
- config: configs/train/ft_pat_d1.yaml
  overrides: ["seed=0", "device=cuda", "variant=abl_ref4", "train.epochs=4"]
- config: configs/train/ft_pat_ssl_d1.yaml
  overrides: ["seed=0", "device=cuda", "train.epochs=8", "init_from=results/pt-pat_pretrain-npp_pfc-d1open-s0/best.pt"]
- config: configs/train/ft_pat_d1_l10.yaml
  overrides: ["seed=0", "device=cuda"]
- config: configs/train/ft_pat_ssl_d1_l10.yaml
  overrides: ["seed=0", "device=cuda", "init_from=results/pt-pat_pretrain-npp_pfc-d1open-s0/best.pt"]
- config: configs/train/ft_pat_d1_l01.yaml
  overrides: ["seed=0", "device=cuda"]
- config: configs/train/ft_pat_ssl_d1_l01.yaml
  overrides: ["seed=0", "device=cuda", "init_from=results/pt-pat_pretrain-npp_pfc-d1open-s0/best.pt"]
- config: configs/train/b3_gru_d1.yaml
  overrides: ["seed=0", "device=cuda", "split=configs/splits/d1_open.yaml", "split_name=d1open"]
- config: configs/train/b2_cnn_d1.yaml
  overrides: ["seed=0", "device=cuda", "split=configs/splits/d1_open.yaml", "split_name=d1open"]
