# B1: XGBoost on prefix flow statistics (spec 005). CPU. One booster per K on
# spec 004's grid, each trained on prefix_flowstats(K): statistics recomputed from
# the first K packets only, never the stored whole-flow vector.
model:
  name: xgb
  n_estimators: 2000
  learning_rate: 0.1
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  class_weight_cap: 10.0
  n_jobs: -1
  max_train_flows: null   # optional uniform subsample of the train period, for speed

search:
  model.learning_rate: {loguniform: [0.03, 0.3]}
  model.max_depth: {int: [4, 10]}
  model.subsample: {uniform: [0.6, 1.0]}
  model.colsample_bytree: {uniform: [0.5, 1.0]}
