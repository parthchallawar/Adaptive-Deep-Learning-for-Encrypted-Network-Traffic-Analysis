# B1 XGBoost on D1 (spec 005, plan T8-follow-up). CPU only -- XGBoost gains
# nothing from Kaggle's GPU with this training path (models/baselines/xgb.py
# uses tree_method="hist" on the CPU), so this runs on a separate CPU kernel
# (kernel/train-b1/) rather than sharing the GPU one and holding a GPU idle.
# `seed` is overridden per seed (kernel/train-b1/kernel.py) for the 3-seed
# protocol (spec 004). No `train:` section: XGBBaseline.fit trains one
# booster per K directly, not through the shared epoch loop.
defaults:
  - ../models/baselines/xgb.yaml
  - base.yaml

variant: main
